name: Docker PR Build and Scan

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write
  packages: write

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # ──────────────────────────────────────────────────────────────
      # build container and push to GitHub Container Registry
      # ──────────────────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image to GHCR
        id: build
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ github.sha }}
            ghcr.io/${{ github.repository }}:pr-${{ github.event.pull_request.number }}
          sbom: true
          provenance: false

      # ──────────────────────────────────────────────────────────────
      # scan Docker image with Trivy and post results to PR
      # ──────────────────────────────────────────────────────────────
      - name: Scan Docker image with Trivy and generate summary
        uses: aquasecurity/trivy-action@0.30.0
        with:
          image-ref: 'ghcr.io/${{ github.repository }}:${{ github.sha }}'
          format: 'table'
          output: 'trivy-results.txt'
          severity: 'CRITICAL,HIGH,MEDIUM'

      - name: Post Trivy scan results to PR
        if: github.event_name == 'pull_request'
        shell: python
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          import json
          import os
          import re
          import urllib.request

          with open("trivy-results.txt", encoding="utf-8") as fh:
              full_results = fh.read()

          match = re.search(r"Report Summary\n\n(.*?)\nLegend:", full_results, re.S)
          summary_section = (
              match.group(1).strip()
              if match
              else "No vulnerability summary found. Please check the full report in the Actions tab."
          )

          repo = os.environ["GITHUB_REPOSITORY"]
          owner, name = repo.split("/", 1)
          body = (
              "## Trivy Security Scan Summary\n\n"
              f"```\n{summary_section}\n```\n\n"
              "---\n\n"
              f"*For detailed results, please [view the actions output]"
              f"(https://github.com/{repo}/actions/runs/{os.environ['GITHUB_RUN_ID']}).*"
          )

          request = urllib.request.Request(
              url=f"{os.environ['GITHUB_API_URL']}/repos/{owner}/{name}/issues/{os.environ['PR_NUMBER']}/comments",
              data=json.dumps({"body": body}).encode("utf-8"),
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                  "Content-Type": "application/json",
                  "X-GitHub-Api-Version": "2022-11-28",
              },
              method="POST",
          )
          with urllib.request.urlopen(request):
              pass

      # ──────────────────────────────────────────────────────────────
      # publish Trivy results to action log
      # ──────────────────────────────────────────────────────────────
      - name: Publish Trivy to action log
        run: |
          if [[ -s trivy-results.txt ]]; then
            {
              echo "### Trivy Scan Results"
              echo "<details><summary>Click to expand</summary>"
              echo ""
              echo '```terraform'
              cat trivy-results.txt
              echo '```'
              echo "</details>"
            } >> $GITHUB_STEP_SUMMARY
          fi

      # ──────────────────────────────────────────────────────────────
      # clean up old images
      # ──────────────────────────────────────────────────────────────
      - name: Clean up old images
        uses: ./.github/actions/ghcr-cleanup-action-pr-build
        with:
          token: ${{ github.token }}
