name: GHCR Cleanup Action (Deploy)
description: Cleans up PR images and orphaned SHA images during deployment

inputs:
  token:
    description: "GitHub token"
    required: true
  pr-number:
    description: "PR number to delete the associated image"
    required: true

runs:
  using: composite
  steps:
    - name: Cleanup PR image and orphaned SHA images
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        PR_NUMBER: ${{ inputs['pr-number'] }}
        CLEANUP_MODE: deploy
      run: |
        python3 "$GITHUB_ACTION_PATH/../ghcr-cleanup/cleanup.py"
